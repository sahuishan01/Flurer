[workspace]
# `src-tauri` (this Cargo.toml) is both the workspace root and the main app
# package (its `[package]` section below), alongside two satellite crates:
#   - watch-protocol: message types + named-pipe framing shared by the main
#     app (pipe client) and watchd (pipe server) — see its own doc comment.
#   - watchd: the elevated Windows service that reads the NTFS USN Journal.
#     Kept out of flurer_lib/flurer.exe entirely so the main app's privilege
#     level never has to change; see docs/superpowers/specs/2026-08-16-usn-journal-watcher-design.md.
members = ["watch-protocol", "watchd"]
resolver = "2"

[package]
name = "flurer"
version = "0.4.86"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flurer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.52.3"
http = "1.4.2"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15.0"
trash = "5"
dirs = "6.0.0"
wmi = "0.13"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
keyring = "4.1.4"
base64 = "0.22"
url = "2"
zip = "2"
tempfile = "3.27.0"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = "2"
tauri-plugin-dialog = "2.7.2"
sha2 = "0.10"
watch-protocol = { path = "watch-protocol" }

[target.'cfg(windows)'.dependencies]
# Named-pipe client to flurer-watchd only — see sizecache/watchd_client.rs.
# Win32_System_IO is required alongside Win32_Storage_FileSystem for
# CreateFileW/ReadFile/WriteFile to resolve at all (CI: E0432 "no
# CreateFileW/ReadFile/WriteFile in Win32::Storage::FileSystem" without
# it) — their signatures reference LPOVERLAPPED from that module, and
# windows-sys ties an item's availability to every module its signature
# touches, not just its own containing module.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
