name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A release pushes main and then the tag seconds later, so without this the
# same commit gets built twice: once here as CI, once by release.yml for the
# actual installers. The job-level `if` below covers the usual case; this
# covers the rest. Both are needed — see the comment on each.
concurrency:
  # Deliberately the same group name as release.yml, keyed on the commit, so
  # the two workflows contend for one slot instead of running side by side.
  group: flurer-build-${{ github.sha }}
  # Never cancel a run that is already going. If release.yml somehow started
  # first, cancelling it would throw away the installers that release depends
  # on; queueing behind it is the safe direction to fail.
  cancel-in-progress: false

jobs:
  build:
    # Skip the version-bump commit of a release. The tag push that follows it
    # triggers release.yml, which builds the identical tree, so running this
    # as well is pure duplication.
    #
    # "bump version" as a magic commit subject is already load-bearing here —
    # release.yml's changelog step filters those commits out by the same
    # prefix — so this relies on an existing convention rather than inventing
    # one. head_commit is null on pull_request events, which coerces to an
    # empty string and leaves PR runs unaffected.
    if: ${{ !startsWith(github.event.head_commit.message, 'bump version') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: bun run build

      # flurer-watchd (the elevated USN-Journal service) is a separate
      # workspace member, not part of the flurer_lib/flurer.exe crate
      # graph — build it explicitly so tauri.conf.json's resource bundling
      # step (which copies target/release/flurer-watchd.exe into the
      # installer) has something to find. See
      # docs/superpowers/specs/2026-08-16-usn-journal-watcher-design.md.
      - name: Build flurer-watchd service
        run: cargo build --release -p flurer-watchd
        working-directory: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
