name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build plugins
        run: |
          cd plugins/git
          bun install
          bun run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: bun run build

      # flurer-watchd (the elevated USN-Journal service) is a separate
      # workspace member, not part of the flurer_lib/flurer.exe crate
      # graph — build it explicitly so tauri.conf.json's resource bundling
      # step (which copies target/release/flurer-watchd.exe into the
      # installer) has something to find. See
      # docs/superpowers/specs/2026-08-16-usn-journal-watcher-design.md.
      - name: Build flurer-watchd service
        run: cargo build --release -p flurer-watchd
        working-directory: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
