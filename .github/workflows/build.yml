name: Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flurer-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump version') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get purge -y needrestart || true
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test native path helpers
        run: bun test tests/fs.test.ts

      - name: Test settings and registry
        run: bun test tests/settings.test.ts

      - name: Test design spec matches the stylesheet
        run: bun test tests/design.test.ts

      - name: Test plugin permissions
        run: bun test tests/pluginPermissions.test.ts tests/pluginGateway.test.ts tests/permissionMap.test.ts tests/pluginGlobals.test.ts tests/pluginEscape.test.ts tests/pluginBundle.test.ts tests/pluginWindowsEnv.test.ts

      - name: Build frontend
        run: bun run build

      - name: Build flurer-watchd service
        if: runner.os == 'Windows'
        run: cargo build --release -p flurer-watchd
        working-directory: src-tauri

      - name: Test filesystem and disk discovery
        working-directory: src-tauri
        run: |
          cargo test -p flurer --lib fs::
          cargo test -p flurer --lib disks::

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
